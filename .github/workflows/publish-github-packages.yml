name: Publish to GitHub Packages

# Publishes novatar to GitHub Packages as @nika-loki/novatar, keeping the
# npmjs.com "novatar" package untouched. Runs on every GitHub release and on
# demand — no secrets needed (uses the built-in GITHUB_TOKEN).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      - name: Publish @nika-loki/novatar
        run: node scripts/publish-github-packages.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
